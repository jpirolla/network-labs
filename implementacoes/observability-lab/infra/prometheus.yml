global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Métricas do OTel Collector (coleta métricas que o Collector já processou)
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  # API Gateway — métricas do processo uvicorn (se expuser /metrics diretamente)
  # Na nossa arquitetura, as métricas chegam via OTel → Collector → Prometheus exporter
  # Este scrape é apenas como fallback ou para métricas de processo nativas
  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:8000"]
    metrics_path: /metrics
    # Silencia erro caso o endpoint não exista (é opcional)
    honor_timestamps: true

  - job_name: "service-a"
    static_configs:
      - targets: ["service-a:8001"]
    metrics_path: /metrics
    honor_timestamps: true

  - job_name: "service-b"
    static_configs:
      - targets: ["service-b:8002"]
    metrics_path: /metrics
    honor_timestamps: true

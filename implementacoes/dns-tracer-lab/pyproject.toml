[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dns-tracer"
version = "1.0.0"
description = "Low-level DNS analysis tool: raw UDP sockets, full packet parsing, iterative resolution"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
dns-tracer = "dns_tracer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dns_tracer*"]
